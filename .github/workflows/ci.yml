name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # gofmt exits zero even when it has complaints, so the output is what
        # has to be checked.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go mod tidy
        # A go.mod that go mod tidy would still change (a stray // indirect,
        # a dependency the code no longer imports) is the kind of drift that
        # is invisible until someone stares at a diff, so CI checks it here
        # instead.
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage gate
        # internal/domain holds the logic that decides which train to catch, so
        # a drop in its coverage is the one worth failing the build over. The
        # statement percentage comes from the package's own run rather than
        # from averaging per-function figures, which would weight a one-line
        # accessor the same as the ranking itself.
        run: |
          go tool cover -func=coverage.out | tail -1
          domain=$(go test -cover ./internal/domain/ \
            | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')
          echo "internal/domain coverage: ${domain}%"
          awk -v c="$domain" 'BEGIN { exit (c >= 90) ? 0 : 1 }' || {
            echo "internal/domain coverage ${domain}% is below the 90% gate" >&2
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned rather than "latest": a new golangci-lint release adding a
          # rule is otherwise a build break with no code change to explain it.
          # Bump deliberately, alongside .golangci.yml if a new rule needs
          # addressing.
          version: v2.12.2

  release:
    # §4.2: GitHub Actions builds and pushes the Docker image on a tag — it is
    # never the scheduler itself, since `schedule:` triggers run 5-20 minutes
    # late, which this system's minute-scale delivery budget cannot absorb.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
