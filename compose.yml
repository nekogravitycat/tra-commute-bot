# docker compose up -d
#
# Config lives in ./configs/config.yaml (copy configs/config.example.yaml and
# tune it), credentials in ./env — see .example.env. Both are bind-mounted
# read-only; state, settings.json and the archive live in the named volume so
# a container recreate never loses a live setting or the day's tick guard.
services:
  tracommute:
    # Built by .github/workflows/ci.yml's build-image job on every push to
    # main; `edge` always tracks that branch's most recent build.
    image: ghcr.io/nekogravitycat/tra-commute-bot:edge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./configs/config.yaml:/etc/tra-commute/config.yaml:ro
      - tra-commute-data:/var/lib/tra-commute
    logging:
      # The default json-file driver has no size limit of its own — a
      # process that runs all day, every day, would otherwise grow its log
      # file without bound.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tra-commute-data:
