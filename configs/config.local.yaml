# Local development configuration.
#
# Identical to config.example.yaml except that state and archives are written
# inside the project directory rather than under /var/lib.
#
#   go run ./cmd/tracommute -config configs/config.local.yaml -dry-run -force
schedules:
  - name: "平日通勤"
    weekdays: [Mon, Tue, Wed, Thu, Fri]
    at: "07:50"

skip_dates: []
tick_tolerance_minutes: 2
retry_window_minutes: 10

timing:
  ready_lead_minutes: 30

route:
  origin_station_id: "1080"
  origin_name: "桃園"
  destination_station_id: "1000"
  destination_name: "臺北"
  usual_train_nos: ["2008", "1136", "1138"]
  lookback_minutes: 30
  lookahead_minutes: 60
  excluded_train_type_ids: ["1101", "1107"]
  excluded_train_type_keywords: ["普悠瑪", "太魯閣"]
  known_train_type_keywords: ["區間快", "區間", "自強", "莒光", "復興", "普快"]
  unknown_train_type_policy: "include_and_flag"

constraints:
  clock_in_deadline: "09:30"
  last_mile_minutes: 20
  boarding_buffer_minutes: 2
  risk_margin_minutes: 3

certificate:
  enabled: true
  min_delay_minutes: 5
  note: "臺北站櫃檯人工申請"

compensation:
  enabled: true
  max_early_leave_minutes: 15
  severe_delay_threshold: 30

api:
  request_interval_ms: 1500
  timeout_seconds: 15

output:
  max_alternatives: 4
  timezone: "Asia/Taipei"

storage:
  state_path: ".local/state.json"
  archive_dir: ".local/dumps"
  archive_retain_days: 30
